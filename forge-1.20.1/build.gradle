// Forge 1.20.1 port of the renderer, for the Society: Sunlit Valley modpack.
// Standalone like ../forge-1.12.2: it compiles the shared JNI facade from
// ../rtxremix-java/src directly and never touches the root Fabric build.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

def gitOutput = { List<String> command ->
    providers.exec { commandLine command; ignoreExitValue = true }.standardOutput.asText.map { it.trim() }
}
def gitShortHash = gitOutput(['git', 'rev-parse', '--short=7', 'HEAD'])
def gitBranch = gitOutput(['git', 'rev-parse', '--abbrev-ref', 'HEAD'])
// Ignore untracked build outputs; wrapper sources are tracked with the mod.
def gitDirty = gitOutput(['git', 'status', '--porcelain', '--untracked-files=no'])
        .map { it.isEmpty() ? '' : '-dirty' }

// The base version has one source of truth, the root gradle.properties. Each
// build is stamped like the root build's, because NativeExtractor re-extracts
// the runtime only when the mod version or architecture in its marker changes.
def rootProperties = new Properties()
file('../gradle.properties').withInputStream { rootProperties.load(it) }
def buildTimestamp = java.time.ZonedDateTime.now(java.time.ZoneOffset.UTC)
        .format(java.time.format.DateTimeFormatter.ofPattern('yyyyMMddHHmm'))
def archProperty = project.findProperty('arch')
group = 'com.nvidia.rtxremix.forge'
version = "${rootProperties.getProperty('mod_version')}-${buildTimestamp}-${gitShortHash.get()}" +
        "${gitDirty.get()}${archProperty ? '-' + archProperty : ''}"
base { archivesName = 'rtx-remix-forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

sourceSets.main.java.srcDirs += ['../rtxremix-java/src']

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MixinExtras is nested with jar-in-jar; Forge 47 does not ship it. Its
    // processor must precede Mixin's: javac runs processors in classpath order,
    // and Mixin's writes no refmap entries for injector types not yet registered,
    // so every @WrapOperation would miss its SRG target at runtime.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }

    // Sunlit Valley ships Embeddium, which replaces vanilla's chunk builder and
    // section visibility; terrain capture hooks its meshing task instead.
    implementation fg.deobf("maven.modrinth:embeddium:${embeddium_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

mixin {
    add sourceSets.main, 'rtxremix.refmap.json'
    config 'rtxremix.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
    // Pin the per-frame install cap so tests don't depend on the CPU count
    systemProperty 'rtxremix.chunk.maxInstalledColumnsPerFrame', '8'
}

processResources {
    // Repository-only asset notes contain relative links, not runtime resources.
    exclude 'README.md'
    def props = [version: project.version, minecraft_version: minecraft_version, forge_version: forge_version]
    inputs.properties props
    inputs.property 'gitShortHash', gitShortHash
    inputs.property 'gitBranch', gitBranch
    filesMatching('META-INF/mods.toml') { expand props }
    filesMatching('benchmark.properties') {
        expand 'gitCommit': gitShortHash.get(), 'gitBranch': gitBranch.get()
    }
}

// The jar-in-jar output is the mod; the plain jar is only its input.
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('jarJar') { archiveClassifier = '' }
tasks.withType(Jar).configureEach {
    manifest {
        attributes(
            'Specification-Title': 'RTX Remix for Minecraft (Forge 1.20.1)',
            'Implementation-Title': 'RTX Remix for Minecraft (Forge 1.20.1)',
            'Implementation-Version': project.version,
            'MixinConfigs': 'rtxremix.mixins.json'
        )
    }
}
tasks.named('jarJar') {
    from('../LICENSE')
    from('../NOTICE')
}
tasks.named('jar').configure { finalizedBy 'reobfJar' }
tasks.named('jarJar').configure { finalizedBy 'reobfJarJar' }
reobf { jarJar {} }
tasks.named('assemble').configure { dependsOn 'jarJar' }

apply from: 'packaging.gradle'
